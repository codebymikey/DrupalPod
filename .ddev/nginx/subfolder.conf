# Support for a pseudo-subfolder (/subfolder) without an actual directory.
# Useful for test environments, alternate base_paths, or previewing site clones.

# Redirect bare /subfolder requests to include a trailing slash
location = /subfolder {
    absolute_redirect off;
    rewrite ^ /subfolder/ redirect;
}

# Rewrites non-existing files or dynamic paths to index.php
location @subfolder_rewrite {
    # For D7 and above:
    # Clean URLs are handled in drupal_environment_initialize().
    rewrite ^ /subfolder/index.php;
}

location ^~ /subfolder/ {
    root /var/www/html/web;
    index index.php index.html;

    # add_header X-Psuedo-Subfolder True;

    location ~* '\.php$|^/subfolder/update.php' {
        include fastcgi_params;
        fastcgi_split_path_info ^/subfolder(.+\.php)(/.+)?$;

        # Pretend Drupal is installed in /subfolder
        fastcgi_param SCRIPT_NAME /subfolder$fastcgi_script_name;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_index index.php;
        fastcgi_intercept_errors off;
        # fastcgi_read_timeout should match max_execution_time in php.ini
        fastcgi_read_timeout 10m;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param HTTPS $fcgi_https;
        #internal;
    }

    location ~* /subfolder(?<subpath>.*) {
        try_files $uri $subpath /subfolder/index.php?$query_string; # For Drupal >= 7

        # Handle image styles for Drupal 7+
        location ~* ^/subfolder/sites/.*/files/styles/ {
            try_files $subpath @subfolder_rewrite;
        }

        ## Regular private file serving (i.e. handled by Drupal).
        location ~* ^/subfolder/system/files/ {
            ## For not signaling a 404 in the error log whenever the
            ## system/files directory is accessed add the line below.
            ## Note that the 404 is the intended behavior.
            log_not_found off;
            access_log off;
            expires 30d;
            try_files $subpath @subfolder_rewrite;
        }

        location ~* \.(jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|webp|htc)$ {
            try_files $subpath @subfolder_rewrite;
            expires max;
            log_not_found off;
        }

        # js and css always loaded
        location ~* \.(js|css)$ {
            try_files $subpath @subfolder_rewrite;
            expires -1;
            log_not_found off;
        }
    }

    location ~* \.php$ {
        return 404;
    }
}
