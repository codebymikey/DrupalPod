#ddev-generated
# Remove the line above if you don't want this file to be overwritten when you run
# ddev get ddev/ddev-selenium-standalone-chrome
#
# This file comes from https://github.com/ddev/ddev-selenium-standalone-chrome
#
services:
  selenium-chrome:
    image: seleniarm/standalone-chromium:4.1.4-20220429
    container_name: ddev-${DDEV_SITENAME}-selenium-chrome
    expose:
      # The internal noVNC port, which operates over HTTP so it can be exposed
      # through the router.
      - 7900
    environment:
      - VIRTUAL_HOST=$DDEV_HOSTNAME
      - HTTPS_EXPOSE=7900:7900
      - HTTP_EXPOSE=7910:7900
      - VNC_NO_PASSWORD=1
    external_links:
      - ddev-router:${DDEV_SITENAME}.${DDEV_TLD}
    # To enable VNC access for traditional VNC clients like macOS "Screen Sharing",
    # uncomment the next line.
    # ports: ["5900:5900"]
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: $DDEV_APPROOT
    volumes:
      - ".:/mnt/ddev_config"

  web:
    links:
      - selenium-chrome
    environment:
      # PHPUnit
      SYMFONY_DEPRECATIONS_HELPER: weak
      BROWSERTEST_OUTPUT_DIRECTORY: /tmp
      BROWSERTEST_OUTPUT_BASE_URL: ${DDEV_PRIMARY_URL}
      SIMPLETEST_BASE_URL: http://web
      SIMPLETEST_DB: mysql://db:db@db/db
      # Use disable-dev-shm-usage instead of setting shm_usage
      # https://developers.google.com/web/tools/puppeteer/troubleshooting#tips
      # The format of chromeOptions is defined at https://chromedriver.chromium.org/capabilities
      MINK_DRIVER_ARGS_WEBDRIVER: &web_driver_args >-
        [
          "chrome",
          {
            "browserName": "chrome",
            "goog:chromeOptions": {
              "w3c": false,
              "args": ["--disable-gpu","--no-sandbox","--disable-dev-shm-usage"${CHROME_HEADLESS_JSON_ARG-,\"--headless\"}]
            }
          },
          "http://selenium-chrome:4444/wd/hub"
        ]
      # Nightwatch
      DRUPAL_TEST_BASE_URL: http://web
      DRUPAL_TEST_DB_URL: mysql://db:db@db/db
      DRUPAL_TEST_WEBDRIVER_HOSTNAME: selenium-chrome
      DRUPAL_TEST_WEBDRIVER_PORT: 4444
      DRUPAL_TEST_WEBDRIVER_PATH_PREFIX: /wd/hub
      DRUPAL_TEST_WEBDRIVER_CHROME_ARGS: "--disable-gpu --no-sandbox --disable-dev-shm-usage${CHROME_HEADLESS_ARG- --headless}"
      DRUPAL_TEST_CHROMEDRIVER_AUTOSTART: false
      DRUPAL_NIGHTWATCH_SEARCH_DIRECTORY: ../
      DRUPAL_NIGHTWATCH_IGNORE_DIRECTORIES: node_modules,vendor,.*,sites/*/files,sites/*/private,sites/simpletest
      DRUPAL_NIGHTWATCH_OUTPUT: reports/nightwatch
      # DTT
      DTT_BASE_URL: http://web
      DTT_MINK_DRIVER_ARGS: *web_driver_args
